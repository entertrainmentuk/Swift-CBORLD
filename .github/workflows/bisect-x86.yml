# TEMPORARY: isolates the Swift 6.0.3 x86_64 release-mode test crash.
# Remove before merging.
name: Bisect x86_64 crash

on:
  pull_request:

permissions:
  contents: read

jobs:
  bisect:
    name: Bisect (${{ matrix.configuration }}${{ matrix.flags != '' && ', no CMO' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: release
            flags: ""
          - configuration: release
            flags: "-Xswiftc -disable-cmo"
          - configuration: debug
            flags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build tests
        run: swift build -c ${{ matrix.configuration }} --build-tests -Xswiftc -enable-testing ${{ matrix.flags }}
      - name: Run each variant separately
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no
        run: |
          for t in ZBisectTests/testF1_PreparedOverDirect ZBisectTests/testF2_PreparedFits \
            ZBisectTests/testF3_PreparedSmallLimitSmallDocument ZBisectTests/testF4_PreparedConstructOnly \
            ZBisectTests/testF5_PreparedRegistryZero ZBisectTests/testF6_PreparedDefaultLimitsSmallDocument \
            ZBisectTests/testF7_PreparedFromStaticHelper ZBisectPlainTests/testP1_PreparedOverPlainImport \
            ResourceSafetyTests/testOutputLimitIsExactAndAppliesToEveryEncodePath; do
            if swift test -c ${{ matrix.configuration }} ${{ matrix.flags }} --skip-build --disable-swift-testing --filter "$t" > out.log 2>&1; then
              echo "PASS $t"
            else
              echo "FAIL $t"
              grep -a -E "crashed|Bad pointer|^ *[0-9]+ \[|error:" out.log | head -24
            fi
          done
