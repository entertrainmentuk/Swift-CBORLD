name: Comparator pins

on:
  push:
    branches: [main]
    paths:
      - Interop/comparators.json
      - Scripts/verify-comparator-pins.sh
      - .github/workflows/comparator-pins.yml
  pull_request:
    paths:
      - Interop/comparators.json
      - Scripts/verify-comparator-pins.sh
      - .github/workflows/comparator-pins.yml
  workflow_dispatch:
  # Re-verify weekly that every pinned archive is still served unchanged.
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify immutable comparator archives
        run: Scripts/verify-comparator-pins.sh
